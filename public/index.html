<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Your Job | Mobility Access Modifications</title>
  <meta name="description" content="Check the latest status of your job with Mobility Access Modifications." />
  <meta name="theme-color" content="#e36e25" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=6" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e36e25'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' font-weight='bold' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#tracker">Skip to job tracker</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="https://www.mobilityaccess.com.au/" class="brand" aria-label="Mobility Access Modifications">
        <img src="/assets/mam-logo.png" alt="Mobility Access Modifications" width="200" height="78" />
      </a>
      <a class="header-phone" href="tel:+61393504400">(03) 9350 4400</a>
    </div>
  </header>

  <main>
    <section class="tracker-wrap" id="tracker" tabindex="-1">
      <div class="container">
        <div class="tracker-card">
          <h1>Track your job</h1>
          <p class="tracker-sub" id="tracker-sub">Enter your job number to see the latest status of your job. You can also add the name at the job address and post code to verify it.</p>

          <form id="quote-form" novalidate>
            <div class="field">
              <label for="jobNumber">Job number</label>
              <input id="jobNumber" name="jobNumber" type="text" inputmode="numeric"
                     autocomplete="off" placeholder="e.g. 1048" required
                     aria-describedby="form-error" />
            </div>
            <div class="field optional-field">
              <label for="clientName">Name at the job address</label>
              <input id="clientName" name="clientName" type="text" autocomplete="name"
                     placeholder="e.g. Jane Smith"
                     aria-describedby="form-error" />
            </div>
            <div class="field optional-field">
              <label for="postcode">Post code</label>
              <input id="postcode" name="postcode" type="text" inputmode="numeric"
                     autocomplete="postal-code" placeholder="e.g. 3058"
                     maxlength="4" aria-describedby="form-error" />
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">
              <span class="btn-label">Check status</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
            <p class="form-error" id="form-error" role="alert" hidden></p>
          </form>
        </div>

        <!-- Concise status announcements for screen readers (loading + outcome summary). -->
        <p id="status-region" class="sr-only" role="status" aria-live="polite"></p>

        <div id="results" class="results" role="region" aria-label="Job status result" tabindex="-1"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Need help? Call <a href="tel:+61393504400">(03) 9350 4400</a></p>
      <p class="footer-fine">&copy; <span id="year"></span> Mobility Access Modifications</p>
    </div>
  </footer>

  <script src="/app.js?v=8" type="module"></script>
</body>
</html>
